name: Release

# Tags every plugin whose version has no `<plugin>--v<version>` tag yet and
# creates a GitHub Release from its CHANGELOG.md section.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push tags and create releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # existing tags decide what is already released

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Claude Code CLI (version pinned in package-lock.json)
        run: npm ci

      - name: Structural linter
        run: node scripts/validate-marketplace.mjs

      - name: Tag new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release-tags.mjs --push --github-release
