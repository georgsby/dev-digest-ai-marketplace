name: Catalog site

# Separate from "Validate marketplace": this workflow only builds and publishes the site.
# Its "Build catalog site" check shows up on its own in PRs and in the Actions tab.

on:
  pull_request:
    paths:
      - 'catalog-site/**'
      - '.claude-plugin/marketplace.json'
      - 'plugins/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'catalog-site/**'
      - '.claude-plugin/marketplace.json'
      - 'plugins/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build catalog site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # plugin "updated" dates come from git history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: catalog-site/package-lock.json

      - name: Install dependencies
        working-directory: catalog-site
        run: npm ci

      - name: Build catalog data and site
        working-directory: catalog-site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: catalog-site/dist

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests only build; publishing happens from main (or a manual run on main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
